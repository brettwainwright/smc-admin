{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMC 2027 Volunteer Schedule</title>
  {% include "schedule/_brand_head.html" %}
  <style>
{% include "schedule/theme.css" %}

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--app-bg); color: var(--app-text);
      font: 16px/1.5 var(--app-font);
    }
    header {
      background: var(--app-surface); text-align: center; padding: 1.5rem 1rem 1.25rem;
      border-bottom: 4px solid; border-image: var(--brand-gradient) 1;
    }
    header img { display: block; width: min(100%, 26rem); height: auto; margin: 0 auto; }
    .tagline {
      margin: .6rem 0 0; font-size: .8rem; font-weight: 800; font-style: italic;
      letter-spacing: .14em; text-transform: uppercase; color: var(--brand-crimson);
    }
    main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
    h1 { margin: 0 0 1rem; font-size: 1.35rem; }
    h2 {
      margin: 1.75rem 0 .75rem; font-size: .9rem; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase; color: var(--brand-crimson);
    }
    label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: .35rem; }
    select {
      width: 100%; padding: .6rem .75rem; font: inherit; color: inherit;
      background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--app-radius);
    }
    select:focus {
      outline: none; border-color: var(--app-primary); box-shadow: 0 0 0 3px rgba(var(--app-primary-rgb), .18);
    }
    .muted { color: var(--app-muted); }
    .info {
      background: var(--app-surface); border: 1px solid var(--app-border); border-radius: var(--app-radius);
      padding: .9rem 1rem; margin-top: 1rem;
    }
    .card {
      position: relative; overflow: hidden; background: var(--app-surface); border-radius: 12px;
      padding: 1rem 1.25rem 1rem 1.5rem; margin-bottom: .75rem;
      box-shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 4px 12px rgba(16, 24, 40, .05);
    }
    /* Brand gradient stripe down the left edge */
    .card::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 5px;
      background: linear-gradient(180deg, var(--brand-crimson), var(--brand-coral));
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .card h3 { margin: 0; font-size: 1.1rem; }
    .badge {
      flex: none; font-size: .8rem; font-weight: 600; padding: .15rem .6rem; border-radius: 999px;
      color: var(--brand-navy); background: rgba(40, 80, 112, .1);
    }
    .meta { margin: .5rem 0 0; padding: 0; list-style: none; }
    .card h4 { margin: .75rem 0 .1rem; font-size: .95rem; }
    .card p { margin: 0; white-space: pre-wrap; }
    nav {
      position: fixed; inset: auto 0 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: .75rem;
      padding: .75rem 1rem; background: var(--app-surface); box-shadow: 0 -1px 6px rgba(16, 24, 40, .08);
    }
    /* Crimson-to-red only: the coral end is too light behind white text */
    nav a {
      text-align: center; padding: .7rem 1rem; font-weight: 600; text-decoration: none; color: #fff;
      background: linear-gradient(90deg, var(--brand-crimson), var(--brand-red)); border-radius: var(--app-radius);
    }
    nav a:hover { background: var(--brand-crimson); }
    nav a:focus-visible { outline: 3px solid rgba(var(--app-primary-rgb), .4); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <img src="{% static 'brand/smc-2027-logo.png' %}" alt="SMC 2027" width="1200" height="149">
    <p class="tagline">Made for more</p>
  </header>
  <main>
    <h1>Volunteer Schedule</h1>
    {% if volunteers %}
    <label for="volunteer">Find your schedule</label>
    <select id="volunteer">
      <option value="" selected disabled>Choose your name</option>
      {% for v in volunteers %}<option value="{{ v.id }}">{{ v.name }}</option>{% endfor %}
    </select>
    <div id="schedule" aria-live="polite"></div>
    {% else %}
    <p class="info">No volunteers have signed up yet.</p>
    {% endif %}
  </main>

  {# Images are served from schedule/static/photos #}
  <nav>
    <a href="{% static 'photos/map.jpeg' %}">🗺️ View map</a>
    <a href="{% static 'photos/schedule.jpeg' %}">📅 Full schedule</a>
  </nav>

  <template id="event-card">
    <article class="card">
      <div class="card-head"><h3 data-field="name"></h3><span class="badge" data-field="type"></span></div>
      <ul class="meta">
        <li>📅 <span data-field="day"></span></li>
        <li>🕒 <strong data-field="time"></strong></li>
        <li>📍 <span data-field="location"></span></li>
      </ul>
      <div data-section="description"><h4>Description</h4><p data-field="description"></p></div>
      <div data-section="details"><h4>Details</h4><p data-field="details"></p></div>
    </article>
  </template>

  <script>
    (function () {
      var select = document.getElementById("volunteer");
      if (!select) return;
      var output = document.getElementById("schedule");
      var cardTemplate = document.getElementById("event-card");

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function card(event) {
        var node = cardTemplate.content.cloneNode(true);
        node.querySelectorAll("[data-field]").forEach(function (field) {
          field.textContent = event[field.dataset.field] || "";
        });
        // Optional fields only appear when they have a value
        if (!event.type) node.querySelector(".badge").remove();
        ["description", "details"].forEach(function (name) {
          if (!event[name]) node.querySelector('[data-section="' + name + '"]').remove();
        });
        return node;
      }

      function show(events) {
        output.replaceChildren();
        if (!events.length) {
          output.append(el("p", "info", "You're not scheduled for any events yet."));
          return;
        }
        output.append(el("p", "muted", events.length + " event" + (events.length === 1 ? "" : "s")));
        // Events arrive sorted by day then start, so a new heading starts each day
        var day = null;
        events.forEach(function (event) {
          if (event.day !== day) output.append(el("h2", null, (day = event.day)));
          output.append(card(event));
        });
      }

      select.addEventListener("change", function () {
        var id = select.value;
        fetch("/api/volunteers/" + encodeURIComponent(id) + "/events")
          .then(function (response) {
            if (!response.ok) throw new Error(response.status);
            return response.json();
          })
          // Ignore a slow response if they've already picked someone else
          .then(function (events) { if (select.value === id) show(events); })
          .catch(function () {
            output.replaceChildren(el("p", "info", "Couldn't load the schedule. Please try again."));
          });
      });
    })();
  </script>
</body>
</html>
